<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolScribe Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">ToolScribe</span>
          <span id="conn-status" class="status-pill offline">Checking Auth...</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-toggle-settings" class="icon-btn" title="Settings & Connection">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Inline Auth Panel (Shown automatically if user is not signed in on any open tab) -->
    <div id="auth-panel" class="settings-panel hidden">
      <div class="settings-header">
        <span class="settings-title">Connect Account for Database Sync</span>
      </div>
      <p style="font-size: 11px; color: var(--ts-text-muted); margin-bottom: 6px;">
        Connect your logged-in ToolScribe session so clips write directly to Supabase <code>tools</code> &amp; <code>vault_items</code>.
      </p>
      <button id="btn-connect-webapp" class="btn btn-primary" style="padding: 7px 10px; font-size: 12px; margin-bottom: 6px;">
        ⚡ 1-Click Connect via ToolScribe Web App
      </button>
      <details style="font-size: 11px; color: var(--ts-text-muted);">
        <summary style="cursor: pointer; font-weight: 500; margin-bottom: 6px;">Or sign in with Email &amp; Password</summary>
        <div class="field-group" style="margin-bottom: 6px;">
          <label for="auth-email">Email</label>
          <input type="email" id="auth-email" placeholder="you@example.com" class="input-text">
        </div>
        <div class="field-group" style="margin-bottom: 6px;">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" placeholder="••••••••" class="input-text">
        </div>
        <p id="auth-error" class="hidden" style="font-size: 11px; color: var(--ts-error); margin-bottom: 4px;"></p>
        <button id="btn-login" class="btn btn-secondary" style="padding: 6px 10px; font-size: 12px;">Sign In &amp; Sync Pending Clips</button>
      </details>
    </div>

    <!-- Settings Drawer (Hidden by default) -->
    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-header">
        <span class="settings-title">Supabase &amp; App Connection</span>
        <button id="btn-logout" class="icon-btn" style="font-size: 10px; padding: 2px 6px;">Sign Out</button>
      </div>
      <div class="field-group">
        <label for="cfg-webapp-url">ToolScribe Web App URL</label>
        <input type="text" id="cfg-webapp-url" placeholder="https://tool-scribes-p9lk.vercel.app" class="input-text">
      </div>
      <div class="field-group">
        <label for="cfg-supabase-url">Supabase Project URL</label>
        <input type="text" id="cfg-supabase-url" placeholder="https://xyz.supabase.co" class="input-text">
      </div>
      <div class="field-group">
        <label for="cfg-supabase-key">Anon Public Key</label>
        <input type="password" id="cfg-supabase-key" placeholder="sb_publishable_..." class="input-text">
      </div>
      <button id="btn-save-settings" class="btn btn-secondary">Save Configuration</button>
    </div>

    <!-- Main Clipper View -->
    <main id="clipper-main">
      <!-- Live Page Summary Card -->
      <div class="page-card">
        <div class="page-card-header">
          <img id="page-favicon" class="page-favicon" alt="Icon" style="display: none;">
          <input type="text" id="tool-name" class="input-inline-title" placeholder="Tool Name..." required>
        </div>
        <p id="page-url" class="page-url truncate">https://...</p>
        <textarea id="tool-desc" class="input-desc" rows="2" placeholder="Brief description / what this tool does..."></textarea>
      </div>

      <!-- Clipper Metadata Inputs -->
      <div class="form-section">
        <div class="form-row">
          <div class="field-group flex-1">
            <label for="tool-collection">Destination</label>
            <select id="tool-collection" class="input-select">
              <option value="vault">Personal Vault + Discover</option>
            </select>
          </div>
          <div class="field-group flex-1">
            <label for="tool-category">Category</label>
            <select id="tool-category" class="input-select">
              <option value="dev">Developer Tools</option>
              <option value="ai">AI &amp; ML</option>
              <option value="design">Design &amp; UI</option>
              <option value="prod">Productivity</option>
              <option value="learn">Learning</option>
              <option value="util">Utilities &amp; Social</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="field-group flex-1">
            <label for="tool-pricing">Pricing Model</label>
            <select id="tool-pricing" class="input-select">
              <option value="freemium">Freemium</option>
              <option value="free">100% Free</option>
              <option value="open_source">Open Source</option>
              <option value="paid">Paid Only</option>
            </select>
          </div>
          <div class="field-group flex-1">
            <label for="tool-tags">Tags</label>
            <input type="text" id="tool-tags" class="input-text" placeholder="cli, social, cloud">
          </div>
        </div>

        <div class="field-group">
          <label for="tool-gotcha">Personal Note / "Gotcha"</label>
          <input type="text" id="tool-gotcha" class="input-text" placeholder="e.g. Great free tier, rate-limits after 50 req/min">
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-footer">
        <button id="btn-save-tool" class="btn btn-primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
          </svg>
          Save to ToolScribe
        </button>
      </div>

      <!-- Feedback / Result Banner -->
      <div id="result-banner" class="result-banner hidden">
        <span id="result-text">Saved to your vault!</span>
        <a id="result-link" href="#" class="result-link">Open Vault &rarr;</a>
      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
